<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Preview Card</title>
    <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Figtree', sans-serif;
            font-size: 16px;
        }
        p {
            color: hsl(0, 0%, 42%);
            font-weight: 500;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0px;
            background-color: hsl(47, 88%, 63%);
        }
        .container {
            background-color: white;
            border: 1px solid hsl(0, 0%, 7%);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-wrap: wrap;
            width: min(80vw, 350px);
            max-width: 350px;
            height: auto;
            border-radius: 20px;
            box-shadow: 8px 8px 0px 0px #000000;
        }
        .items {
            width: 90%;
        }
        .main-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 20px;
            flex-shrink: 1;
        }
        .item2 {
            margin-top: 20px;
            display: block;


        }
        .category-tag {
            display: inline-block;
            background-color: hsl(47, 88%, 63%);
            padding: 3px 10px;
            border-radius: 5px;
            color: hsl(0, 0%, 7%);
            font-weight: 800;
            margin: 0px;
        }
        .category-tag:hover {
            cursor: pointer;
            background-color: transparent;
            color: hsl(47, 88%, 63%);
            border: 1px solid hsl(47, 88%, 63%);
            min-height: 0;
        }
        .item3 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .black-paragraph {
            color: hsl(0, 0%, 7%);
            font-weight: 800;
        }
        h1 {
            font-weight: 800;
            font-size: 22px;
        }
        h1:hover {
            color: hsl(47, 88%, 63%);
            cursor: pointer;
        }
        .published {
            color: black;
        }

        @media (320px <= width <= 375px) {
            .container {
                min-width: 90vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item1" role="img" aria-label="illustration article image">
            <img class="main-img" src="images/illustration-article.svg" alt="illustration article image">
        </div>
        <div class="items item2" role="group" aria-label="article information">
            <p class="category-tag" role="button" aria-pressed="false">Learning</p>
            <p class="published" role="text">Published 21 Dec 2023</p>
            <h1 role="heading" aria-level="1">HTML & CSS foundations</h1>
            <p role="text">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="items item3" role="group" aria-label="author information">
            <img class="avatar" src="images/image-avatar.webp" alt="image avatar">
            <p class="black-paragraph" role="text">Greg Hooper</p>
        </div>
    </div>
</body>
</html>
